<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with glow -->
  <circle cx="100" cy="100" r="90" fill="url(#grad1)" opacity="0.15" filter="url(#glow)"/>
  
  <!-- Main hexagon shape -->
  <path d="M100 20 L165 55 L165 125 L100 160 L35 125 L35 55 Z" 
        stroke="url(#grad1)" 
        stroke-width="3" 
        fill="none"
        filter="url(#glow)"/>
  
  <!-- Inner hexagon -->
  <path d="M100 45 L145 67 L145 113 L100 135 L55 113 L55 67 Z" 
        stroke="url(#grad2)" 
        stroke-width="2" 
        fill="none"
        opacity="0.6"/>
  
  <!-- Central bot icon - head -->
  <rect x="80" y="65" width="40" height="35" rx="8" fill="url(#grad1)" filter="url(#glow)"/>
  
  <!-- Bot eyes -->
  <circle cx="92" cy="80" r="5" fill="#0a0a12"/>
  <circle cx="108" cy="80" r="5" fill="#0a0a12"/>
  <circle cx="92" cy="80" r="2" fill="#22d3ee"/>
  <circle cx="108" cy="80" r="2" fill="#22d3ee"/>
  
  <!-- Bot mouth -->
  <path d="M90 90 L100 95 L110 90" stroke="#0a0a12" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Bot antenna -->
  <line x1="100" y1="65" x2="100" y2="50" stroke="url(#grad1)" stroke-width="2"/>
  <circle cx="100" cy="47" r="4" fill="#22d3ee" filter="url(#glow)"/>
  
  <!-- Bot body -->
  <rect x="85" y="100" width="30" height="25" rx="5" fill="url(#grad1)" opacity="0.8"/>
  
  <!-- Connection nodes -->
  <circle cx="100" cy="35" r="3" fill="#8b5cf6" filter="url(#glow)"/>
  <circle cx="140" cy="60" r="3" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="140" cy="120" r="3" fill="#8b5cf6" filter="url(#glow)"/>
  <circle cx="100" cy="145" r="3" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="60" cy="120" r="3" fill="#8b5cf6" filter="url(#glow)"/>
  <circle cx="60" cy="60" r="3" fill="#06b6d4" filter="url(#glow)"/>
  
  <!-- Connection lines -->
  <line x1="100" y1="35" x2="100" y2="47" stroke="#8b5cf6" stroke-width="1" opacity="0.5"/>
  <line x1="140" y1="60" x2="125" y2="70" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
  <line x1="140" y1="120" x2="125" y2="110" stroke="#8b5cf6" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="145" x2="100" y2="125" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
  <line x1="60" y1="120" x2="75" y2="110" stroke="#8b5cf6" stroke-width="1" opacity="0.5"/>
  <line x1="60" y1="60" x2="75" y2="70" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
</svg>
