<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#0a0a12"/>
  
  <!-- Hexagon outline -->
  <path d="M16 3 L27 9 L27 23 L16 29 L5 23 L5 9 Z" 
        stroke="url(#grad)" 
        stroke-width="1.5" 
        fill="none"/>
  
  <!-- Bot head -->
  <rect x="11" y="10" width="10" height="8" rx="2" fill="url(#grad)"/>
  
  <!-- Eyes -->
  <circle cx="13.5" cy="13.5" r="1.2" fill="#0a0a12"/>
  <circle cx="18.5" cy="13.5" r="1.2" fill="#0a0a12"/>
  <circle cx="13.5" cy="13.5" r="0.5" fill="#22d3ee"/>
  <circle cx="18.5" cy="13.5" r="0.5" fill="#22d3ee"/>
  
  <!-- Antenna -->
  <line x1="16" y1="10" x2="16" y2="7" stroke="url(#grad)" stroke-width="1"/>
  <circle cx="16" cy="6" r="1.2" fill="#22d3ee"/>
  
  <!-- Body -->
  <rect x="12.5" y="18.5" width="7" height="6" rx="1.5" fill="url(#grad)" opacity="0.8"/>
</svg>
